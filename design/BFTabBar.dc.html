<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="flex:none;position:relative;height:88px;background:#FFFFFF;border-top:1px solid #ECE6F1;display:flex;align-items:flex-start;padding:8px 4px 0;font-family:'Barlow',sans-serif">
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:{{ c.inicio }}">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>
    <span style="font-size:11px;font-weight:{{ w.inicio }}">Início</span>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:{{ c.eventos }}">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
    <span style="font-size:11px;font-weight:{{ w.eventos }}">Eventos</span>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:{{ c.vip }}">
    <div style="width:54px;height:54px;margin-top:-26px;border-radius:18px;background:{{ vipBg }};display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px -6px rgba(90,24,134,.55);border:3px solid #FFFFFF">
      <img src="assets/logo-symbol-white.png" alt="" style="width:34px;height:auto;display:block"></img>
    </div>
    <span style="font-size:11px;font-weight:{{ w.vip }};white-space:nowrap">Espaço VIP</span>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:{{ c.beneficios }}">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"></path><circle cx="7.5" cy="7.5" r="1.5"></circle></svg>
    <span style="font-size:11px;font-weight:{{ w.beneficios }}">Benefícios</span>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:{{ c.perfil }}">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>
    <span style="font-size:11px;font-weight:{{ w.perfil }}">Perfil</span>
  </div>
  <div style="position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:#160B1E"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:120},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;inicio&quot;,&quot;eventos&quot;,&quot;vip&quot;,&quot;beneficios&quot;,&quot;perfil&quot;],&quot;default&quot;:&quot;inicio&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'inicio';
    const keys = ['inicio','eventos','vip','beneficios','perfil'];
    const c = {}, w = {};
    keys.forEach(k => { c[k] = k === a ? '#5A1886' : '#7A7086'; w[k] = k === a ? 700 : 500; });
    return { c, w, vipBg: a === 'vip' ? '#F6730C' : '#5A1886' };
  }
}
</script>
</body>
</html>
